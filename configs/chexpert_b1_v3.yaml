# ── Recipe ──────────────────────────────────────────────────────────────────
recipe: uslfa_v3   # "v2_legacy" | "uslfa_v3"

# ── Model ────────────────────────────────────────────────────────────────────
backbone:
  name: efficientnet_b1
  pretrained: true
  mid_tap: 5
  deep_tap: 8

input_resolution: 224      # 224 | 320
max_params: 20000000       # 20M parameter budget (B1 backbone ~6.5M + heads ~10M)

feat_dim: 256
num_classes: 14
fuse_block5: true
attn_pool_mode: norm_avg   # sum | norm_avg
disable_dilation3: false

# Attention normalization
att_norm: spatial_softmax      # sigmoid | spatial_softmax | temp_sigmoid
attn_temperature: 0.5

# Focus loss
attn_regularizer_weight: 0.05
focus_normalize: true          # divide entropy by ln(H*W) → [0,1]; interpretable
# Per-class focus weights (14 values). Lower = less entropy penalty for that class.
# Diffuse classes (Edema=5, Cardiomegaly=2, Lung Opacity=3, Pleural Effusion=10, Support Devices=13)
# get 0.5 weight; focal classes stay at 1.0
focus_class_weights:
  - 1.0   # 0 No Finding
  - 1.0   # 1 Enlarged Cardiomediastinum
  - 0.5   # 2 Cardiomegaly          (diffuse)
  - 0.5   # 3 Lung Opacity           (diffuse)
  - 1.0   # 4 Lung Lesion
  - 0.5   # 5 Edema                  (diffuse)
  - 1.0   # 6 Consolidation
  - 1.0   # 7 Pneumonia
  - 1.0   # 8 Atelectasis
  - 1.0   # 9 Pneumothorax
  - 0.5   # 10 Pleural Effusion      (diffuse)
  - 1.0   # 11 Pleural Other
  - 1.0   # 12 Fracture
  - 0.5   # 13 Support Devices       (diffuse)

# Diversity loss
diversity_reg_weight: 0.05
div_mode: cooc_masked      # all_pairs | cooc_masked
div_cooc_threshold: 0.1    # Jaccard below this → penalize pair
div_exclude_indices: [0, 13]  # No Finding and Support Devices always excluded

# Log attn diagnostics every N steps (0 = disabled)
log_attn_every_n_steps: 100

# Classification head
head:
  type: label_adaptive     # linear14 | label_adaptive
  hidden: 256
  emb_dim: 64
  use_adapter: true
  use_gate: true
  gate_init_bias: 2.0      # sigmoid(2.0) ≈ 0.88 → starts gate near 1

# ── Data ─────────────────────────────────────────────────────────────────────
data:
  index_csv: data/chexpert_subset/chexpert_materialized_index.csv
  cache_dir: data/chexpert_cache
  val_frac: 0.10
  test_frac: 0.10
  split_seed: 42
  uncertain_policy: u_soft       # u_zeros | u_ones | u_ignore | u_soft
  uncertain_target: 0.5          # target for uncertain labels (0.5 for USLFA)
  nan_policy: soft               # ignore | soft (treat NaN / missing as 0.5 soft probability)
  nan_target: 0.5                # soft target for NaN labels
  # Per-class uncertain policy overrides (optional)
  # per_class_policy:
  #   8: u_zeros   # Atelectasis → treat uncertain as negative

# ── Sampler ──────────────────────────────────────────────────────────────────
sampler:
  mode: random               # random | tiered  (default=random for uslt)
  batch_size: 32
  # Tiered sampler settings (only used when mode=tiered):
  pool_counts: [14, 12, 6]
  batches_per_epoch: 800
  intra_pool_mode: sqrt_freq
  pool_thresholds: [0.05, 0.25]
  seed: 42

# ── Loss ─────────────────────────────────────────────────────────────────────
loss:
  type: uslt                 # bce_wpos (legacy) | uslt
  # USLT parameters:
  beta: 0.999                # effective-number beta (try 0.99 for more variance)
  alpha_mode: effective_num  # effective_num | sqrt_inv_freq
  lambda_u: 0.5              # uncertainty suppression strength (sweep: 0,0.25,0.5,0.75,1.0)
  eps: 0.1                   # minimum suppression factor
  # NOTE: pos_weight is NOT applied when loss.type=uslt (double-correction fix)
  # Legacy bce_wpos parameters:
  pos_weight_mode: sampled_stream
  pos_weight_n_batches: 200
  cohort_sqrt_weights: [2.24, 3.63, 2.06, 1.02, 4.22, 1.80, 3.58, 8.26, 2.28, 2.72, 1.28, 6.51, 4.24, 0.95]

# ── Training ─────────────────────────────────────────────────────────────────
training:
  stage_a_epochs: 5
  stage_a_lr: 1.0e-3
  stage_a_weight_decay: 1.0e-2
  stage_a_patience: 3

  stage_b_epochs: 20
  stage_b_backbone_lr: 1.0e-5
  stage_b_head_lr: 1.0e-4
  stage_b_weight_decay: 1.0e-2
  stage_b_patience: 5
  stage_b_unfreeze_mode: last4   # last4 | full

  warmup_epochs: 1
  label_smoothing: 0.0
  early_stop_metric: mean_auprc
  use_amp: true
  use_ema: false
  ema_decay: 0.999
  num_workers: 4
  pin_memory: true
  seed: 42

# ── Evaluation ───────────────────────────────────────────────────────────────
eval:
  val_batch_size: 64
  threshold_default: 0.5
  threshold_tuning: true
  calibration: true
  compute_ece: true
  exclude_uncertain_from_eval: true   # exclude raw==-1 from metric computation

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  mlflow_experiment: chexpert_b1_v3
  checkpoint_dir: checkpoints/chexpert_b1_v3
  results_dir: outputs/chexpert_b1_v3
  log_sampler_ratios: true
  log_pos_rates: true
  save_attention_samples: true

# ── Experiment ───────────────────────────────────────────────────────────────
experiment:
  name: chexpert_b1_v3_uslfa_nan05
  notes: "v3: USLFA u_soft=0.5 + NaN treated as 0.5 soft target (nan_policy=soft, nan_target=0.5)"
