# ==============================================================================
# CheXpert V4 ("v4_gap") Configuration: EfficientNet-B1 Control Run
# ==============================================================================

recipe: v4_gap

# ── Model ─────────────────────────────────────────────────────────────────────
backbone:
  name: efficientnet_b1
  pretrained: true
  mid_tap: 5
  deep_tap: 8

input_size: 240
max_params: 12000000      # 12M parameter budget
feat_dim: 256
num_classes: 14
msfb_dil3: true

head:
  type: label_adaptive
  hidden: 256
  emb_dim: 64
  use_adapter: true
  use_gate: true

# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  uncertain_target: 0.5    # target value for uncertain labels (-1) in train
  uncertain_policy: soft   # soft | ignore
  lam_u: 0.5               # uncertainty suppression lambda
  eps: 0.1                 # minimum suppression floor
  blank_weight: 1.0        # loss weight factor for blank (NaN) labels

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  alpha_mode: effective_number   # effective_number | sqrt_inv_freq | none
  beta: 0.999                    # effective-number beta (control run = 0.999)
  lam_u: 0.5
  eps: 0.1
  blank_weight: 1.0

# ── Data & Batch Construction ────────────────────────────────────────────────
data:
  index_csv: data/chexpert_subset/chexpert_materialized_index.csv
  cache_dir: data/chexpert_cache
  split_seed: 42
  train_frac: 0.70
  val_frac: 0.10
  test_frac: 0.20
  view_filter: none       # none | frontal | lateral
  hflip: true
  batch_size: 32
  eval_batch_size: 64
  num_workers: 8
  sampler: random         # random | tiered

# ── Training Protocol ────────────────────────────────────────────────────────
training:
  protocol: two_stage     # two_stage | single_stage
  seed: 42
  amp: true
  grad_clip: 1.0

  stage_a:
    epochs: 5
    lr: 1.0e-3
    min_lr: 1.0e-6
    weight_decay: 1.0e-4
    patience: 3

  stage_b:
    epochs: 20
    unfreeze_from: 5      # unfreeze features[5:] (set to 0 for full unfreeze)
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
    min_lr: 1.0e-7
    weight_decay: 1.0e-4
    warmup_epochs: 1
    patience: 5
    ema: false

  single_stage:
    epochs: 30
    lr: 1.0e-4
    weight_decay: 1.0e-4
    warmup_epochs: 5

# ── Evaluation & Calibration ─────────────────────────────────────────────────
evaluation:
  min_positives_lift: 20
  bootstrap_iters_val: 200
  bootstrap_iters_test: 1000

# ── Outputs ──────────────────────────────────────────────────────────────────
output:
  checkpoints_dir: checkpoints/chexpert_v4
  reports_dir: reports
  splits_dir: splits

