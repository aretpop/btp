# Ablation a: v2 legacy baseline (double-correction still present)
# PURPOSE: exact reproduction of old training for fair before/after comparison.
# This keeps tiered sampler + pos_weight, the original double-correction setup.
recipe: v2_legacy

backbone:
  name: efficientnet_b1
  pretrained: true
  mid_tap: 5
  deep_tap: 8

input_resolution: 224
feat_dim: 256
num_classes: 14
fuse_block5: true
attn_pool_mode: norm_avg
att_norm: spatial_softmax
attn_temperature: 0.5
attn_regularizer_weight: 0.05
focus_normalize: false
diversity_reg_weight: 0.05
div_mode: all_pairs

head:
  type: linear14

data:
  index_csv: data/chexpert_subset/chexpert_materialized_index.csv
  cache_dir: data/chexpert_cache
  val_frac: 0.10
  test_frac: 0.10
  split_seed: 42
  uncertain_policy: smooth
  uncertain_target: 0.70

sampler:
  mode: tiered
  batch_size: 32
  pool_counts: [14, 12, 6]
  batches_per_epoch: 800
  intra_pool_mode: sqrt_freq
  seed: 42

loss:
  type: bce_wpos
  pos_weight_mode: sampled_stream
  pos_weight_n_batches: 200
  cohort_sqrt_weights: [2.24, 3.63, 2.06, 1.02, 4.22, 1.80, 3.58, 8.26, 2.28, 2.72, 1.28, 6.51, 4.24, 0.95]

training:
  stage_a_epochs: 5
  stage_a_lr: 1.0e-3
  stage_a_weight_decay: 1.0e-2
  stage_a_patience: 3
  stage_b_epochs: 20
  stage_b_backbone_lr: 1.0e-5
  stage_b_head_lr: 1.0e-4
  stage_b_weight_decay: 1.0e-2
  stage_b_patience: 5
  stage_b_unfreeze_mode: last3
  warmup_epochs: 1
  use_amp: true
  seed: 42
  early_stop_metric: mean_auprc

experiment:
  name: ablation_a_v2_legacy
  notes: "v2 legacy: tiered+pos_weight double-correction, linear14 head, all_pairs div"

